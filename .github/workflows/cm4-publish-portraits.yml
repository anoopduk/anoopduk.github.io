name: CM4 publish local portraits

on:
  push:
    branches: [main]
    paths:
      - 'cm4-2026/portrait-seed/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cm4-publish-portraits
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Assemble verified portrait set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          download_artifact() {
            local id="$1" name="$2"
            mkdir -p "/tmp/$name"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "/tmp/${name}.zip"
            unzip -q "/tmp/${name}.zip" -d "/tmp/$name"
          }

          download_artifact 9224031746 base
          download_artifact 9224402328 fixes
          download_artifact 9224492224 lasttwo
          download_artifact 9224536814 susmita
          download_artifact 9224639231 polish
          download_artifact 9224720669 rajeev

          rm -rf cm4-2026/assets/people
          mkdir -p cm4-2026/assets/people
          cp /tmp/base/assets/people/*.webp cm4-2026/assets/people/
          cp /tmp/fixes/people/*.webp cm4-2026/assets/people/
          cp /tmp/lasttwo/people/*.webp cm4-2026/assets/people/
          cp /tmp/susmita/people/*.webp cm4-2026/assets/people/
          cp /tmp/polish/people/*.webp cm4-2026/assets/people/
          cp /tmp/rajeev/people/*.webp cm4-2026/assets/people/

          # One-time import from the known Sason Shaik portrait source. The source server has an incomplete TLS chain.
          curl --fail --location --retry 2 --insecure -A 'Mozilla/5.0' \
            'https://www.eurchembond.com/wp-content/uploads/2024/06/Sason_Shaik-500x500.jpg' \
            -o /tmp/sason-shaik.jpg
          python - <<'PY'
          from PIL import Image, ImageOps
          im=Image.open('/tmp/sason-shaik.jpg').convert('RGB')
          im=ImageOps.fit(im,(480,600),method=Image.Resampling.LANCZOS,centering=(0.5,0.48))
          im.save('cm4-2026/assets/people/sason-shaik.webp','WEBP',quality=82,method=6)
          PY

          cp cm4-2026/portrait-seed/pnv-pavankumar.webp cm4-2026/assets/people/pnv-pavankumar.webp

          count="$(find cm4-2026/assets/people -maxdepth 1 -name '*.webp' | wc -l)"
          echo "Assembled $count portraits"
          test "$count" -eq 44

      - name: Verify image files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files=sorted(Path('cm4-2026/assets/people').glob('*.webp'))
          assert len(files)==44, len(files)
          bad=[]
          for p in files:
              try:
                  with Image.open(p) as im:
                      im.load()
                      if im.size != (480,600): bad.append((p.name,im.size))
              except Exception as exc:
                  bad.append((p.name,str(exc)))
          assert not bad,bad
          print('Verified 44 readable portraits at 480x600.')
          PY

      - name: Point every person card to local portraits
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,re

          mapping={
            'Rajeev Ahuja':'rajeev-ahuja',
            'Deb Ranjan Banerjee':'deb-ranjan-banerjee',
            'Aditi Chandrasekar':'aditi-chandrasekhar',
            'Aditi Chandrasekhar':'aditi-chandrasekhar',
            'Peter Comba':'peter-comba',
            'Étienne Derat':'etienne-derat',
            'Odile Eisenstein':'odile-eisenstein',
            'Sagar Ghorai':'sagar-ghorai',
            'Subhas Ghosal':'subhas-ghosal',
            'E. D. Jemmis':'ed-jemmis',
            'Milan Kumar Jena':'milan-kumar-jena',
            'B. Kiran':'b-kiran',
            'Sandeep Kumar':'sandeep-kumar',
            'Arup Mahata':'arup-mahata',
            'Satoshi Maeda':'satoshi-maeda',
            'Sabyasachi Mishra':'sabyasachi-mishra',
            'T. Pradeep':'t-pradeep',
            'Sai G. Ramesh':'sai-g-ramesh',
            'N. Satyamurthy':'n-satyamurthy',
            'Henry F. Schaefer III':'henry-f-schaefer-iii',
            'Sason Shaik':'sason-shaik',
            'A. Sirohiwal':'a-sirohiwal',
            'R. B. Sunoj':'rb-sunoj',
            'R. S. Swathi':'rs-swathi',
            'Soujanya Yarasi':'soujanya-yarasi',
            'Anoop Ayyappan':'anoop-ayyappan',
            'Manoj Kumar T. K.':'manoj-kumar-tk',
            'Sherin D. R.':'sherin-dr',
            'Susmita De':'susmita-de',
            'C. H. Suresh':'ch-suresh',
            'Mahesh Hariharan':'mahesh-hariharan',
            'P. N. V. Pavankumar':'pnv-pavankumar',
            'Bharatam V. Prasad':'bharatam-v-prasad',
            'G. Narahari Sastry':'g-narahari-sastry',
            'G. Subramanian':'govindan-subramanian',
            'Govindan Subramanian':'govindan-subramanian',
            'Ashwini Kr. Phukan':'ashwini-kr-phukan',
            'Jayasree E. G.':'jayasree-eg',
            'Pancharatna P. D.':'pancharatna-pd',
            'P. Parameswaran':'p-parameswaran',
            'D. L. V. K. Prasad':'dlvk-prasad',
            'Biswarup Pathak':'biswarup-pathak',
            'Dandamudi Usharani':'dandamudi-usharani',
            'Dibyendu Mallick':'dibyendu-mallick',
            'Priyakumari C. P.':'priyakumari-cp',
            'Naiwrit Karmodak':'naiwrit-karmodak',
          }
          target=set(mapping.values())
          assert len(target)==44,len(target)
          existing={p.stem for p in Path('cm4-2026/assets/people').glob('*.webp')}
          assert existing==target,(sorted(target-existing),sorted(existing-target))

          path=Path('cm4-2026/index.html')
          text=path.read_text(encoding='utf-8')
          card_re=re.compile(r'<(?:a|article)\s+class="person-card"[^>]*>.*?</(?:a|article)>',re.S)
          changed=[]
          def patch_card(m):
              card=m.group(0)
              nm=re.search(r'<h3>(.*?)</h3>',card,re.S)
              if not nm:return card
              name=html.unescape(re.sub(r'<[^>]+>','',nm.group(1))).strip()
              slug=mapping.get(name)
              if not slug:return card
              mark=re.search(r'<span class="person-mark">.*?</span>',card,re.S)
              mark_html=mark.group(0) if mark else ''
              img=(f'<img class="person-photo" src="assets/people/{slug}.webp" '
                   f'alt="{html.escape(name,quote=True)}" loading="lazy" decoding="async" '
                   f'width="480" height="600">')
              portrait=f'<span class="portrait">{mark_html}{img}</span>'
              new,n=re.subn(r'<span class="portrait">.*?</span>(?=<span class="person-copy">)',portrait,card,count=1,flags=re.S)
              if n!=1:raise RuntimeError(f'Could not patch portrait block for {name}')
              changed.append((name,slug))
              return new
          out=card_re.sub(patch_card,text)
          seen={slug for _,slug in changed}
          missing=target-seen
          if len(seen)!=44 or missing:
              raise RuntimeError(f'Expected 44 local portrait cards; changed={len(seen)} missing={sorted(missing)}')
          if re.findall(r'<img class="person-photo"[^>]+src="https?://',out):
              raise RuntimeError('Remote person-photo URLs remain')
          path.write_text(out,encoding='utf-8')
          print('Rewrote 44 portrait cards to local WebP assets.')
          PY

      - name: Tune portrait rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('cm4-2026/styles.css')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\.person-card\{padding:1rem 0;border-bottom:1px solid var\(--line\);display:grid;grid-template-columns:[^;]+;',
                   '.person-card{padding:1rem 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:68px 1fr auto;',s)
          s=re.sub(r'\.person-mark\{width:52px;height:52px;border-radius:50%;',
                   '.person-mark{width:56px;height:70px;border-radius:10px;',s)
          s=re.sub(r'\.portrait\{width:52px;height:52px;position:relative;display:block\}',
                   '.portrait{width:56px;height:70px;position:relative;display:block;overflow:hidden;border-radius:10px}',s)
          s=re.sub(r'\.person-photo\{position:absolute;inset:0;width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:center [^;]+;',
                   '.person-photo{position:absolute;inset:0;width:56px;height:70px;border-radius:10px;object-fit:cover;object-position:center center;',s)
          s=re.sub(r'\.compact-list \.person-card\{grid-template-columns:44px 1fr\}\.compact-list \.person-mark\{width:38px;height:38px\}',
                   '.compact-list .person-card{grid-template-columns:52px 1fr}.compact-list .portrait,.compact-list .person-photo,.compact-list .person-mark{width:48px;height:60px;border-radius:9px}',s)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit completed CM4 portrait set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cm4-2026/portrait-seed
          git config user.name 'CM4 site publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add cm4-2026/assets/people cm4-2026/index.html cm4-2026/styles.css cm4-2026/portrait-seed
          git diff --cached --stat
          git commit -m 'Finish CM4 local portrait set'
          git push
