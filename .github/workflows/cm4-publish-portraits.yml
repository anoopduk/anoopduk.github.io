name: CM4 publish local portraits

on:
  push:
    branches: [main]
    paths:
      - 'cm4-2026/portrait-seed/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cm4-publish-portraits
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Assemble verified local portraits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          artifact() {
            local id="$1" name="$2"
            mkdir -p "/tmp/$name"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "/tmp/${name}.zip"
            unzip -q "/tmp/${name}.zip" -d "/tmp/$name"
          }

          artifact 9224031746 base
          artifact 9224402328 fixes
          artifact 9224492224 lasttwo
          artifact 9224536814 susmita
          artifact 9224639231 polish
          artifact 9224720669 rajeev

          rm -rf cm4-2026/assets/people
          mkdir -p cm4-2026/assets/people
          cp /tmp/base/assets/people/*.webp cm4-2026/assets/people/
          cp /tmp/fixes/people/*.webp cm4-2026/assets/people/
          cp /tmp/lasttwo/people/*.webp cm4-2026/assets/people/
          cp /tmp/susmita/people/*.webp cm4-2026/assets/people/
          cp /tmp/polish/people/*.webp cm4-2026/assets/people/
          cp /tmp/rajeev/people/*.webp cm4-2026/assets/people/

          # Sason Shaik: import once, then store locally in the repository.
          curl --fail --location --retry 2 --insecure -A 'Mozilla/5.0' \
            'https://www.eurchembond.com/wp-content/uploads/2024/06/Sason_Shaik-500x500.jpg' \
            -o /tmp/sason-shaik.jpg
          python - <<'PY'
          from PIL import Image, ImageOps
          im = Image.open('/tmp/sason-shaik.jpg').convert('RGB')
          im = ImageOps.fit(im, (480, 600), method=Image.Resampling.LANCZOS, centering=(0.5, 0.48))
          im.save('cm4-2026/assets/people/sason-shaik.webp', 'WEBP', quality=82, method=6)
          PY

          # Govindan Subramanian and P. N. V. Pavankumar were supplied directly.
          # Their valid WebPs were staged as base64 text chunks to avoid binary corruption in transit.
          cat cm4-2026/portrait-seed/govindan.*.b64 | tr -d '\n\r ' | base64 --decode \
            > cm4-2026/assets/people/govindan-subramanian.webp
          cat cm4-2026/portrait-seed/pnv.*.b64 | tr -d '\n\r ' | base64 --decode \
            > cm4-2026/assets/people/pnv-pavankumar.webp

          # Correct the one staging typo in the temporary finalizer, run it, then remove the helper.
          python - <<'PY'
          from pathlib import Path
          p = Path('cm4-2026/scripts/finalize_portraits.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('s = CSS.read_text(encoding="utf-8")ns = re.sub(',
                        's = CSS.read_text(encoding="utf-8")\ns = re.sub(')
          p.write_text(s, encoding='utf-8')
          PY
          python cm4-2026/scripts/finalize_portraits.py

      - name: Commit completed CM4 portrait set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cm4-2026/portrait-seed
          rm -f cm4-2026/scripts/finalize_portraits.py
          git config user.name 'CM4 site publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A cm4-2026/assets/people cm4-2026/index.html cm4-2026/styles.css cm4-2026/portrait-seed cm4-2026/scripts/finalize_portraits.py
          git diff --cached --stat
          git commit -m 'Finish CM4 local portrait set'
          git push
