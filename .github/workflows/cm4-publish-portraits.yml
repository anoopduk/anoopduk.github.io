name: CM4 publish local portraits

on:
  push:
    branches: [main]
    paths:
      - 'cm4-2026/portrait-bundle/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cm4-publish-portraits
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble portrait bundle
        shell: bash
        run: |
          set -euo pipefail
          cat cm4-2026/portrait-bundle/part-* > /tmp/cm4-portraits.b64
          base64 -d /tmp/cm4-portraits.b64 > /tmp/cm4-portraits.zip
          rm -rf cm4-2026/assets/people
          mkdir -p cm4-2026/assets/people
          unzip -q -j /tmp/cm4-portraits.zip -d cm4-2026/assets/people
          test "$(find cm4-2026/assets/people -maxdepth 1 -name '*.webp' | wc -l)" -eq 43

      - name: Verify dimensions
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files=sorted(Path('cm4-2026/assets/people').glob('*.webp'))
          assert len(files)==43, len(files)
          bad=[]
          for p in files:
              with Image.open(p) as im:
                  if im.size != (480,600): bad.append((p.name,im.size))
          assert not bad, bad
          print('Verified 43 portraits at 480x600.')
          PY

      - name: Point every person card to local portraits
        run: |
          python - <<'PY'
          from pathlib import Path
          import html, re

          mapping = {
            'Rajeev Ahuja':'rajeev-ahuja',
            'Deb Ranjan Banerjee':'deb-ranjan-banerjee',
            'Aditi Chandrasekar':'aditi-chandrasekhar',
            'Aditi Chandrasekhar':'aditi-chandrasekhar',
            'Peter Comba':'peter-comba',
            'Étienne Derat':'etienne-derat',
            'Odile Eisenstein':'odile-eisenstein',
            'Sagar Ghorai':'sagar-ghorai',
            'Subhas Ghosal':'subhas-ghosal',
            'E. D. Jemmis':'ed-jemmis',
            'Milan Kumar Jena':'milan-kumar-jena',
            'B. Kiran':'b-kiran',
            'Sandeep Kumar':'sandeep-kumar',
            'Arup Mahata':'arup-mahata',
            'Satoshi Maeda':'satoshi-maeda',
            'Sabyasachi Mishra':'sabyasachi-mishra',
            'T. Pradeep':'t-pradeep',
            'Sai G. Ramesh':'sai-g-ramesh',
            'N. Satyamurthy':'n-satyamurthy',
            'Henry F. Schaefer III':'henry-f-schaefer-iii',
            'Sason Shaik':'sason-shaik',
            'A. Sirohiwal':'a-sirohiwal',
            'R. B. Sunoj':'rb-sunoj',
            'R. S. Swathi':'rs-swathi',
            'Soujanya Yarasi':'soujanya-yarasi',
            'Anoop Ayyappan':'anoop-ayyappan',
            'Manoj Kumar T. K.':'manoj-kumar-tk',
            'Sherin D. R.':'sherin-dr',
            'Susmita De':'susmita-de',
            'C. H. Suresh':'ch-suresh',
            'Mahesh Hariharan':'mahesh-hariharan',
            'Bharatam V. Prasad':'bharatam-v-prasad',
            'G. Narahari Sastry':'g-narahari-sastry',
            'G. Subramanian':'govindan-subramanian',
            'Govindan Subramanian':'govindan-subramanian',
            'Ashwini Kr. Phukan':'ashwini-kr-phukan',
            'Jayasree E. G.':'jayasree-eg',
            'Pancharatna P. D.':'pancharatna-pd',
            'P. Parameswaran':'p-parameswaran',
            'D. L. V. K. Prasad':'dlvk-prasad',
            'Biswarup Pathak':'biswarup-pathak',
            'Dandamudi Usharani':'dandamudi-usharani',
            'Dibyendu Mallick':'dibyendu-mallick',
            'Priyakumari C. P.':'priyakumari-cp',
            'Naiwrit Karmodak':'naiwrit-karmodak',
          }
          target_slugs=set(mapping.values())
          assert len(target_slugs)==43, len(target_slugs)

          path=Path('cm4-2026/index.html')
          text=path.read_text(encoding='utf-8')
          card_re=re.compile(r'<(?:a|article)\s+class="person-card"[^>]*>.*?</(?:a|article)>', re.S)
          changed=[]

          def patch_card(m):
              card=m.group(0)
              nm=re.search(r'<h3>(.*?)</h3>', card, re.S)
              if not nm: return card
              name=html.unescape(re.sub(r'<[^>]+>','',nm.group(1))).strip()
              slug=mapping.get(name)
              if not slug: return card
              mark=re.search(r'<span class="person-mark">.*?</span>', card, re.S)
              mark_html=mark.group(0) if mark else ''
              img=(f'<img class="person-photo" src="assets/people/{slug}.webp" '
                   f'alt="{html.escape(name, quote=True)}" loading="lazy" decoding="async" '
                   f'width="480" height="600">')
              portrait=f'<span class="portrait">{mark_html}{img}</span>'
              new,n=re.subn(r'<span class="portrait">.*?</span>(?=<span class="person-copy">)', portrait, card, count=1, flags=re.S)
              if n != 1:
                  raise RuntimeError(f'Could not patch portrait block for {name}')
              changed.append((name,slug))
              return new

          out=card_re.sub(patch_card,text)
          seen_slugs={slug for _,slug in changed}
          missing=target_slugs-seen_slugs
          if len(seen_slugs)!=43 or missing:
              raise RuntimeError(f'Expected 43 local portrait cards; changed={len(seen_slugs)} missing={sorted(missing)}')
          # Final guard: no remote participant portrait sources may remain.
          remote=re.findall(r'<img class="person-photo"[^>]+src="https?://',out)
          if remote:
              raise RuntimeError(f'Remote person-photo URLs remain: {len(remote)}')
          path.write_text(out,encoding='utf-8')
          print('Rewrote 43 portrait cards to local WebP assets.')
          PY

      - name: Tune portrait rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cm4-2026/styles.css')
          s=p.read_text(encoding='utf-8')
          old='.person-photo{position:absolute;inset:0;width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:center 25%;background:var(--paper-2)}'
          new='.person-photo{position:absolute;inset:0;width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:center 32%;background:var(--paper-2)}'
          if old in s: s=s.replace(old,new)
          elif new not in s: raise RuntimeError('Expected person-photo CSS rule not found')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit published portraits
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cm4-2026/portrait-bundle
          git config user.name 'CM4 site publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add cm4-2026/assets/people cm4-2026/index.html cm4-2026/styles.css cm4-2026/portrait-bundle
          git diff --cached --stat
          git commit -m 'Publish local optimized CM4 participant portraits'
          git push
