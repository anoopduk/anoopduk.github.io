name: CM4 portrait QA build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cm4-portraits.yml'
      - 'cm4-2026/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cm4-portrait-qa
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests beautifulsoup4 'opencv-python-headless==4.12.0.88' pymupdf
      - name: Build verified portrait fixes
        run: python cm4-2026/scripts/fetch_portrait_fixes.py
      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm4-portrait-fixes
          path: cm4-2026/portrait-fixes
          if-no-files-found: error
          retention-days: 7
