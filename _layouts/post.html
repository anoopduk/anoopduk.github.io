---
layout: default
---

<article class="article">
  <header class="article-header">
    <p class="eyebrow">
      <a href="{{ '/writing/' | relative_url }}">Writing</a>
    </p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="article-dek">{{ page.description }}</p>
    {% endif %}
    {% if page.date %}
    <p class="article-byline">
      <span>A. Anoop</span><span aria-hidden="true">·</span>
      <time datetime="{{ page.date | date_to_xmlschema }}"
        >{{ page.date | date: "%-d %B %Y" }}</time
      >
    </p>
    {% endif %}
  </header>
  <div class="article-body">
    {{ content }}
  </div>
  <footer class="article-footer">
    <a href="{{ '/writing/' | relative_url }}">← All writing</a>
  </footer>
</article>
