---
layout: default
---

<article class="page page--prose">
  <header class="page-header">
    {% if page.eyebrow %}
    <p class="eyebrow">{{ page.eyebrow }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.show_author %}
    <p class="page-byline">By <a href="{{ '/about/' | relative_url }}">{{ site.data.profile.name }}</a> · {{ site.data.profile.affiliation }}</p>
    {% endif %}
    {% if page.description %}
    <p class="page-intro">{{ page.description }}</p>
    {% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
