<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7f5ef" data-light="#f7f5ef" data-dark="#101715" />
<meta name="google-site-verification" content="4Nqg-2dgKbeiaiXXqa9IEx3eieFoEtvmueBvwYyw1fY" />
<meta
  name="robots"
  content="{{ page.robots | default: 'index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1' }}"
/>
{% seo %}
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any" />
<link
  rel="alternate"
  type="application/atom+xml"
  title="Writing by A. Anoop"
  href="{{ '/feed.xml' | absolute_url }}"
/>
<script>
  (() => { try { const theme = localStorage.getItem('anoop-theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme; } catch (_) {} })();
</script>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=20260811c" />
<script src="{{ '/assets/js/theme.js' | relative_url }}?v=20260811" defer></script>
{% if page.layout == 'post' %}
  <link rel="stylesheet" href="{{ '/assets/css/writing.css' | relative_url }}" />
{% endif %}
{% if page.extra_css %}
  <link rel="stylesheet" href="{{ page.extra_css | relative_url }}" />
{% endif %}
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "@id": "{{ '/#person' | absolute_url }}",
    "name": "A. Anoop",
    "alternateName": [
      "Anoop Ayyappan",
      "Anakuthil Anoop",
      "Anakuthil Anoop Ayyappan"
    ],
    "url": "{{ '/' | absolute_url }}",
    "mainEntityOfPage": "{{ '/about/' | absolute_url }}",
    "description": "Professor and computational chemist working on automated chemical exploration, molecular discovery and scientific machine learning.",
    "image": {
      "@type": "ImageObject",
      "url": "{{ '/anoop.png' | absolute_url }}",
      "width": 1120,
      "height": 1400
    },
    "jobTitle": "Professor",
    "worksFor": {
      "@type": "CollegeOrUniversity",
      "name": "Digital University Kerala",
      "url": "https://duk.ac.in/"
    },
    "identifier": {
      "@type": "PropertyValue",
      "propertyID": "ORCID",
      "value": "0000-0002-8116-5506",
      "url": "https://orcid.org/0000-0002-8116-5506"
    },
    "knowsAbout": [
      "Computational chemistry",
      "Automated chemical exploration",
      "Reaction discovery",
      "Molecular structure prediction",
      "Molecular discovery",
      "Functional molecular materials",
      "Thermally activated delayed fluorescence",
      "Molecular aggregates",
      "Metal nanoclusters",
      "Nanoalloys",
      "Scientific machine learning",
      "Interpretable machine learning for molecular science",
      "Scientific software"
    ],
    "sameAs": [
      "{{ site.data.profile.official_profile }}",
      "https://anooplab.github.io/",
      "https://github.com/anooplab",
      "https://scholar.google.com/citations?user=QgKaomgAAAAJ",
      "https://orcid.org/0000-0002-8116-5506",
      "https://www.scopus.com/authid/detail.uri?authorId=6508191130",
      "https://www.researchgate.net/profile/Anakuthil_Anoop/publications",
      "https://www.linkedin.com/in/anoop-a-9286125/",
      "https://x.com/A_Anoop_A",
      "https://www.instagram.com/a_anoop_a/",
      "https://www.facebook.com/profile.php?id=61555278326807"
    ]
  }
</script>
{% if page.url == '/about/' %}
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "@id": "{{ '/about/#profile' | absolute_url }}",
    "url": "{{ '/about/' | absolute_url }}",
    "name": "About A. Anoop",
    "description": {{ page.description | jsonify }},
    "mainEntity": {
      "@id": "{{ '/#person' | absolute_url }}"
    }
  }
</script>
{% endif %}
