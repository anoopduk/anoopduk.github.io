<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#101715" />
<meta
  name="robots"
  content="{{ page.robots | default: 'index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1' }}"
/>
{% seo %}
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any" />
<link
  rel="alternate"
  type="application/atom+xml"
  title="Writing by A. Anoop"
  href="{{ '/feed.xml' | absolute_url }}"
/>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
{% if page.layout == 'post' %}
  <link rel="stylesheet" href="{{ '/assets/css/writing.css' | relative_url }}" />
{% endif %}
{% if page.extra_css %}
  <link rel="stylesheet" href="{{ page.extra_css | relative_url }}" />
{% endif %}
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "@id": "{{ '/#person' | absolute_url }}",
    "name": "A. Anoop",
    "alternateName": [
      "Anoop Ayyappan",
      "Anakuthil Anoop",
      "Anakuthil Anoop Ayyappan"
    ],
    "url": "{{ '/' | absolute_url }}",
    "mainEntityOfPage": "{{ '/about/' | absolute_url }}",
    "description": "Professor and computational chemist working on automated chemical exploration, molecular discovery and AI for science.",
    "image": {
      "@type": "ImageObject",
      "url": "{{ '/anoop.png' | absolute_url }}",
      "width": 1120,
      "height": 1400
    },
    "jobTitle": "Professor",
    "worksFor": {
      "@type": "CollegeOrUniversity",
      "name": "Digital University Kerala",
      "url": "https://duk.ac.in/"
    },
    "identifier": {
      "@type": "PropertyValue",
      "propertyID": "ORCID",
      "value": "0000-0002-8116-5506",
      "url": "https://orcid.org/0000-0002-8116-5506"
    },
    "knowsAbout": [
      "Computational chemistry",
      "Automated chemical exploration",
      "Reaction discovery",
      "Molecular structure prediction",
      "Scientific machine learning",
      "Explainable artificial intelligence for molecular science",
      "AI for science",
      "Scientific software"
    ],
    "sameAs": [
      "{{ site.data.profile.official_profile }}",
      "https://anooplab.github.io/",
      "https://github.com/anooplab",
      "https://scholar.google.com/citations?user=QgKaomgAAAAJ",
      "https://orcid.org/0000-0002-8116-5506",
      "https://www.scopus.com/authid/detail.uri?authorId=6508191130",
      "https://www.researchgate.net/profile/Anakuthil_Anoop/publications",
      "https://www.linkedin.com/in/anoop-a-9286125/",
      "https://x.com/A_Anoop_A",
      "https://www.instagram.com/a_anoop_a/",
      "https://www.facebook.com/profile.php?id=61555278326807"
    ]
  }
</script>
{% if page.url == '/about/' %}
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "@id": "{{ '/about/#profile' | absolute_url }}",
    "url": "{{ '/about/' | absolute_url }}",
    "name": "About A. Anoop",
    "description": {{ page.description | jsonify }},
    "mainEntity": {
      "@id": "{{ '/#person' | absolute_url }}"
    }
  }
</script>
{% endif %}
{% if page.research_theme == 'pyar' %}
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareSourceCode",
    "@id": "{{ '/research/pyar/#software' | absolute_url }}",
    "name": "PyAR",
    "alternateName": "Python program for aggregation and reaction",
    "description": {{ page.description | jsonify }},
    "url": "{{ page.url | absolute_url }}",
    "codeRepository": "https://github.com/anooplab/pyar",
    "sameAs": "https://pyar.readthedocs.io/en/latest/",
    "programmingLanguage": "Python",
    "license": "https://www.gnu.org/licenses/gpl-3.0.html",
    "applicationCategory": "Computational chemistry",
    "citation": [
      "https://doi.org/10.1016/j.comptc.2017.03.040",
      "https://doi.org/10.3389/fchem.2019.00644",
      "https://doi.org/10.1002/chem.201705492",
      "https://doi.org/10.1021/acs.jpca.2c03762",
      "https://doi.org/10.1021/acsearthspacechem.3c00321",
      "https://doi.org/10.1002/jcc.70287",
      "https://doi.org/10.1039/D5CP03273C"
    ]
  }
</script>
{% endif %}
{% if page.research_theme == 'reaction-discovery' %}
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "@id": "{{ '/research/reaction-discovery/#page' | absolute_url }}",
    "url": "{{ page.url | absolute_url }}",
    "name": {{ page.title | jsonify }},
    "description": {{ page.description | jsonify }},
    "author": {
      "@id": "{{ '/#person' | absolute_url }}"
    },
    "about": [
      {"@type": "Thing", "name": "Automated reaction discovery"},
      {"@type": "Thing", "name": "Chemical reaction space"},
      {"@type": "Thing", "name": "Prebiotic chemistry"},
      {"@type": "Thing", "name": "Hydrogen cyanide chemistry"}
    ],
    "citation": [
      "https://doi.org/10.1002/anie.201303246",
      "https://doi.org/10.1002/chem.201705492",
      "https://doi.org/10.1021/acsearthspacechem.3c00113",
      "https://doi.org/10.1021/acsearthspacechem.3c00321",
      "https://doi.org/10.26434/chemrxiv-2024-c5mzp"
    ]
  }
</script>
{% endif %}
